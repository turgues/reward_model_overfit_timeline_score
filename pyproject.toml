[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turgues-reward_model_overfit_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列RAG 检索工程师·奖励模型的过拟合的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "turgues" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://turgues.github.io"
Repository = "https://github.com/turgues/reward_model_overfit_timeline_score"
Issues = "https://github.com/turgues/reward_model_overfit_timeline_score/issues"

[project.scripts]
reward_model_overfit_timeline_score = "reward_model_overfit_timeline_score:main"

[tool.setuptools]
py-modules = ["reward_model_overfit_timeline_score"]
